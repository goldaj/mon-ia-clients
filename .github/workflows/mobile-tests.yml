name: Mobile client offline tests
on:
  pull_request:
  push:
    branches: [chatgpt/review-20261024, "feat/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r mobile/requirements.txt
      - run: python -m compileall -q mobile
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check mobile/conversation_backup.js
      - run: node tests/test_mobile_backup.cjs
      - run: python tests/check_mobile_js_syntax.py
