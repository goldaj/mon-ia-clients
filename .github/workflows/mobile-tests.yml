name: Mobile client offline tests
on:
  pull_request:
  push:
    branches: [chatgpt/review-20261024]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r mobile/requirements.txt
      - run: python -m compileall -q mobile
      - run: python -m unittest discover -s tests -v
